services:
  financehub-postgres:
    image: postgres:16-alpine
    container_name: financehub-postgres
    environment:
      POSTGRES_USER: financehub
      POSTGRES_PASSWORD: financehub_password
      POSTGRES_DB: financehub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financehub"]
      interval: 5s
      timeout: 5s
      retries: 5

  financehub-rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: financehub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"    # AMQP protocol
      - "15672:15672"  # Management Web UI
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5

  financehub-jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: financehub-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686" # Jaeger Web UI
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver

volumes:
  postgres_data:
