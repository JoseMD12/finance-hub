services:
  financehub-postgres:
    image: postgres:16-alpine
    container_name: financehub-postgres
    environment:
      POSTGRES_USER: financehub
      POSTGRES_PASSWORD: financehub_password
      POSTGRES_DB: financehub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financehub"]
      interval: 5s
      timeout: 5s
      retries: 5

  financehub-rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: financehub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5

  financehub-jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: financehub-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  transactionaggregator-api:
    build:
      context: .
      dockerfile: src/Services/TransactionAggregator/FinanceHub.TransactionAggregator.Api/Dockerfile
    container_name: transactionaggregator-api
    environment:
      ConnectionStrings__TransactionAggregatorDb: "Host=financehub-postgres;Port=5432;Database=financehub_transactionaggregator;Username=financehub;Password=financehub_password"
      RabbitMq__Host: "financehub-rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://financehub-jaeger:4317"
    ports:
      - "5002:5002"
    depends_on:
      financehub-postgres:
        condition: service_healthy
      financehub-rabbitmq:
        condition: service_healthy

  pluggyintegration-api:
    build:
      context: .
      dockerfile: src/Services/PluggyIntegration/FinanceHub.PluggyIntegration.Api/Dockerfile
    container_name: pluggyintegration-api
    environment:
      RabbitMq__Host: "financehub-rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      PLUGGY_USER_API_BASE_URL: "https://my-api.pluggy.ai"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://financehub-jaeger:4317"
    ports:
      - "5056:5056"
    depends_on:
      financehub-rabbitmq:
        condition: service_healthy

  apigateway-api:
    build:
      context: .
      dockerfile: src/Services/ApiGateway/FinanceHub.ApiGateway/Dockerfile
    container_name: apigateway-api
    environment:
      TRANSACTION_AGGREGATOR_BASE_URL: "http://transactionaggregator-api:5002"
      PLUGGY_INTEGRATION_BASE_URL: "http://pluggyintegration-api:5056"
      JWT_SECRET_KEY: "FinanceHubSuperSecretDevKeyWithAtLeast32BytesLength!"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://financehub-jaeger:4317"
    ports:
      - "5050:5050"
    depends_on:
      - transactionaggregator-api
      - pluggyintegration-api

volumes:
  postgres_data:
