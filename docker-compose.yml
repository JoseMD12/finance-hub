services:
  financehub-postgres:
    image: postgres:16-alpine
    container_name: financehub-postgres
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-financehub}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-financehub_password}
      POSTGRES_DB: ${POSTGRES_DB:-financehub_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-financehub}"]
      interval: 5s
      timeout: 5s
      retries: 5

  financehub-rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: financehub-rabbitmq
    env_file:
      - .env
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "${RabbitMQ__Port:-5672}:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5

  financehub-jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: financehub-jaeger
    env_file:
      - .env
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  transactionaggregator-api:
    build:
      context: .
      dockerfile: src/Services/TransactionAggregator/FinanceHub.TransactionAggregator.Api/Dockerfile
    container_name: transactionaggregator-api
    env_file:
      - .env
    environment:
      ConnectionStrings__TransactionAggregatorDb: "Host=financehub-postgres;Port=5432;Database=financehub_transactionaggregator;Username=${POSTGRES_USER:-financehub};Password=${POSTGRES_PASSWORD:-financehub_password}"
      RabbitMQ__Host: "financehub-rabbitmq"
      RabbitMQ__Port: "${RabbitMQ__Port:-5672}"
      RabbitMQ__Username: "${RabbitMQ__Username:-guest}"
      RabbitMQ__Password: "${RabbitMQ__Password:-guest}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://financehub-jaeger:4317"
    ports:
      - "5002:5002"
    depends_on:
      financehub-postgres:
        condition: service_healthy
      financehub-rabbitmq:
        condition: service_healthy

  pluggyintegration-api:
    build:
      context: .
      dockerfile: src/Services/PluggyIntegration/FinanceHub.PluggyIntegration.Api/Dockerfile
    container_name: pluggyintegration-api
    env_file:
      - .env
    environment:
      RabbitMQ__Host: "financehub-rabbitmq"
      RabbitMQ__Port: "${RabbitMQ__Port:-5672}"
      RabbitMQ__Username: "${RabbitMQ__Username:-guest}"
      RabbitMQ__Password: "${RabbitMQ__Password:-guest}"
      PLUGGY_USER_API_BASE_URL: "${PLUGGY_USER_API_BASE_URL}"
      PLUGGY_USER_TOKEN: "${PLUGGY_USER_TOKEN}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://financehub-jaeger:4317"
    ports:
      - "5056:5056"
    depends_on:
      financehub-rabbitmq:
        condition: service_healthy

  apigateway-api:
    build:
      context: .
      dockerfile: src/Services/ApiGateway/FinanceHub.ApiGateway/Dockerfile
    container_name: apigateway-api
    env_file:
      - .env
    environment:
      TRANSACTION_AGGREGATOR_BASE_URL: "http://transactionaggregator-api:5002"
      PLUGGY_INTEGRATION_BASE_URL: "http://pluggyintegration-api:5056"
      JWT_SECRET_KEY: "${JWT_SECRET_KEY}"
      JWT_ISSUER: "${JWT_ISSUER}"
      JWT_AUDIENCE: "${JWT_AUDIENCE}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://financehub-jaeger:4317"
    ports:
      - "5050:5050"
    depends_on:
      - transactionaggregator-api
      - pluggyintegration-api

  financehub-web:
    build:
      context: ./src/Web/FinanceHub.Web
      dockerfile: Dockerfile
    container_name: financehub-web
    env_file:
      - .env
    ports:
      - "${WEB_PORT:-3000}:80"
    depends_on:
      - apigateway-api

volumes:
  postgres_data:
