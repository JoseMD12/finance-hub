services:
  financehub-postgres:
    image: postgres:16-alpine
    container_name: financehub-postgres
    environment:
      POSTGRES_USER: financehub
      POSTGRES_PASSWORD: financehub_password
      POSTGRES_DB: financehub_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U financehub"]
      interval: 5s
      timeout: 5s
      retries: 5

  financehub-rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: financehub-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_running"]
      interval: 5s
      timeout: 5s
      retries: 5

  financehub-jaeger:
    image: jaegertracing/all-in-one:1.55
    container_name: financehub-jaeger
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"

  authconsent-api:
    build:
      context: .
      dockerfile: src/Services/AuthConsent/FinanceHub.AuthConsent.Api/Dockerfile
    container_name: authconsent-api
    environment:
      ConnectionStrings__AuthConsentDb: "Host=financehub-postgres;Port=5432;Database=financehub_authconsent;Username=financehub;Password=financehub_password"
      RabbitMq__Host: "financehub-rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      MERCADO_PAGO_ACCESS_TOKEN: "${MERCADO_PAGO_ACCESS_TOKEN}"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://financehub-jaeger:4317"
    ports:
      - "5001:5001"
    depends_on:
      financehub-postgres:
        condition: service_healthy
      financehub-rabbitmq:
        condition: service_healthy

  transactionaggregator-api:
    build:
      context: .
      dockerfile: src/Services/TransactionAggregator/FinanceHub.TransactionAggregator.Api/Dockerfile
    container_name: transactionaggregator-api
    environment:
      ConnectionStrings__TransactionAggregatorDb: "Host=financehub-postgres;Port=5432;Database=financehub_transactionaggregator;Username=financehub;Password=financehub_password"
      RabbitMq__Host: "financehub-rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://financehub-jaeger:4317"
    ports:
      - "5002:5002"
    depends_on:
      financehub-postgres:
        condition: service_healthy
      financehub-rabbitmq:
        condition: service_healthy

  apigateway-api:
    build:
      context: .
      dockerfile: src/Services/ApiGateway/FinanceHub.ApiGateway/Dockerfile
    container_name: apigateway-api
    environment:
      AUTH_CONSENT_BASE_URL: "http://authconsent-api:5001"
      TRANSACTION_AGGREGATOR_BASE_URL: "http://transactionaggregator-api:5002"
      MERCADO_PAGO_INTEGRATION_BASE_URL: "http://mercadopagointegration-api:5004"
      JWT_SECRET_KEY: "FinanceHubSuperSecretDevKeyWithAtLeast32BytesLength!"
      JWT_ISSUER: "FinanceHub.ApiGateway"
      JWT_AUDIENCE: "FinanceHub.Web"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://financehub-jaeger:4317"
    ports:
      - "5050:5050"
    depends_on:
      - authconsent-api
      - transactionaggregator-api
      - mercadopagointegration-api

  itauintegration-api:
    build:
      context: .
      dockerfile: src/Services/ItauIntegration/FinanceHub.ItauIntegration.Api/Dockerfile
    container_name: itauintegration-api
    environment:
      RabbitMq__Host: "financehub-rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://financehub-jaeger:4317"
    ports:
      - "5003:5003"
    depends_on:
      financehub-rabbitmq:
        condition: service_healthy

  mercadopagointegration-api:
    build:
      context: .
      dockerfile: src/Services/MercadoPagoIntegration/FinanceHub.MercadoPagoIntegration.Api/Dockerfile
    container_name: mercadopagointegration-api
    environment:
      ConnectionStrings__MercadoPagoIntegrationDb: "Host=financehub-postgres;Port=5432;Database=financehub_mercadopagointegration;Username=financehub;Password=financehub_password"
      AUTH_CONSENT_BASE_URL: "http://authconsent-api:5001"
      OPENFINANCE_CLIENT_ID: "${OPENFINANCE_CLIENT_ID}"
      OPENFINANCE_CLIENT_SECRET: "${OPENFINANCE_CLIENT_SECRET}"
      RabbitMq__Host: "financehub-rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://financehub-jaeger:4317"
    ports:
      - "5004:5004"
    depends_on:
      financehub-postgres:
        condition: service_healthy
      financehub-rabbitmq:
        condition: service_healthy

  interintegration-api:
    build:
      context: .
      dockerfile: src/Services/InterIntegration/FinanceHub.InterIntegration.Api/Dockerfile
    container_name: interintegration-api
    environment:
      RabbitMq__Host: "financehub-rabbitmq"
      RabbitMq__Port: "5672"
      RabbitMq__Username: "guest"
      RabbitMq__Password: "guest"
      OTEL_EXPORTER_OTLP_ENDPOINT: "http://financehub-jaeger:4317"
    ports:
      - "5005:5005"
    depends_on:
      financehub-rabbitmq:
        condition: service_healthy

  financehub-web:
    build:
      context: ./src/Web/finance-hub-web
      dockerfile: Dockerfile
    container_name: financehub-web
    environment:
      - VITE_API_GATEWAY_URL=http://apigateway-api:5050
    ports:
      - "8080:80"
    depends_on:
      - apigateway-api

volumes:
  postgres_data:

